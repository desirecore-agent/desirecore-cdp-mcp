name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag, e.g. v1.2.0
        type: string
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Check tag matches package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "const p=require('./package.json'); if(process.env.RELEASE_TAG!=='v'+p.version) process.exit(1)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - run: npm pack --ignore-scripts
      - run: sha256sum ./*.tgz > SHA256SUMS
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" ./*.tgz SHA256SUMS --verify-tag --generate-notes
